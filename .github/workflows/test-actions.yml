name: Bootstrap MechOS Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack MechOS source
        run: |
          chmod +x mechos-bootstrap.sh
          ./mechos-bootstrap.sh

          # Do not let this workflow create another workflow file.
          rm -f .github/workflows/build-mechos-iso.yml

      - name: Commit MechOS source
        run: |
          rm -f mechos-bootstrap.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Bootstrap MechOS 0.3.2 source"
          git push
