name: Build MechOS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4

      - name: Free disk space for MechOS
        shell: bash
        run: |
          echo "=== BEFORE CLEANUP ==="
          df -h

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true

          sudo docker system prune -af --volumes || true
          sudo apt-get clean || true

          echo "=== AFTER CLEANUP ==="
          df -h

      - name: Validate project files
        run: |
          chmod +x build-iso.sh scripts/*.sh
          chmod +x overlay/rootfs/usr/local/bin/* || true
          chmod +x overlay/rootfs/usr/local/lib/mechos/*.sh || true
          ./scripts/validate-project.sh

      - name: Build Fedora 44 MechOS ISO in privileged container
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out

          docker run --rm --privileged \
            -v /dev:/dev \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -lc '
              set -euxo pipefail

              dnf -y install \
                sudo kiwi kiwi-systemdeps distribution-gpg-keys \
                git rsync python3 qemu-kvm libvirt-client \
                util-linux coreutils findutils file

              chmod +x build-iso.sh scripts/*.sh
              chmod +x overlay/rootfs/usr/local/bin/* || true
              chmod +x overlay/rootfs/usr/local/lib/mechos/*.sh || true

              ./scripts/validate-project.sh
              ./build-iso.sh
            '

      - name: Verify ISO checksum
        shell: bash
        run: |
          set -euxo pipefail

          test -f out/MechOS-0.3.2-alpha-x86_64.iso
          test -f out/MechOS-0.3.2-alpha-x86_64.iso.sha256

          cd out
          sha256sum -c MechOS-0.3.2-alpha-x86_64.iso.sha256
          ls -lh MechOS-0.3.2-alpha-x86_64.iso*

      - name: Split ISO for artifact storage
        shell: bash
        run: |
          set -euxo pipefail

          split -b 450M -d -a 2 \
            out/MechOS-0.3.2-alpha-x86_64.iso \
            out/MechOS-0.3.2-alpha-x86_64.iso.part-

          cp \
            out/MechOS-0.3.2-alpha-x86_64.iso.sha256 \
            out/REASSEMBLE-SHA256.txt

      - name: Upload ISO parts
        uses: actions/upload-artifact@v4
        with:
          name: MechOS-0.3.2-alpha-x86_64
          path: |
            out/MechOS-0.3.2-alpha-x86_64.iso.part-*
            out/REASSEMBLE-SHA256.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
