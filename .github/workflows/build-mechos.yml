name: Build MechOS Arch ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          docker system prune -af || true
          df -h

      - name: Validate repair files
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch-mechos-builder-v0.2.1.py
          bash -n scripts/mechos-v0.2.1-runtime-repair.sh
          bash -n scripts/build-mechos-archiso.sh

      - name: Patch current builder for v0.2.1 runtime repair
        run: |
          set -euo pipefail
          python3 scripts/patch-mechos-builder-v0.2.1.py scripts/build-mechos-archiso.sh
          bash -n scripts/build-mechos-archiso.sh
          grep -n 'MECHOS_V0_2_1_REPAIR' scripts/build-mechos-archiso.sh

      - name: Build MechOS ISO
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash /workspace/scripts/build-mechos-archiso.sh

      - name: Verify ISO and checksum
        run: |
          set -euo pipefail
          ISO="$(find out -maxdepth 2 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          test -s "$ISO"
          ISO_DIR="$(dirname "$ISO")"
          ISO_NAME="$(basename "$ISO")"
          (
            cd "$ISO_DIR"
            sha256sum "$ISO_NAME" > "$ISO_NAME.sha256"
            sha256sum -c "$ISO_NAME.sha256"
          )
          ls -lh "$ISO" "$ISO.sha256"

      - name: Upload MechOS ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: MechOS-v0.2.1-Alpha-x86_64
          path: |
            out/**/*.iso
            out/**/*.iso.sha256
          if-no-files-found: error
          compression-level: 0
