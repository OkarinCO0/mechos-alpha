name: Build MechOS Arch ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean || true
          df -h

      - name: Validate MechOS builder
        shell: bash
        run: |
          set -euxo pipefail
          test -f scripts/build-mechos-archiso.sh
          bash -n scripts/build-mechos-archiso.sh
          chmod +x scripts/build-mechos-archiso.sh

      - name: Build MechOS Arch ISO
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"

          docker run --rm --privileged             -v /dev:/dev             -v "$GITHUB_WORKSPACE:/workspace"             -w /workspace             archlinux:latest             bash /workspace/scripts/build-mechos-archiso.sh

      - name: Verify ISO
        shell: bash
        run: |
          set -euxo pipefail
          test -f out/MechOS-Arch-Creator-x86_64.iso
          test -f out/MechOS-Arch-Creator-x86_64.iso.sha256
          cd out
          sha256sum -c MechOS-Arch-Creator-x86_64.iso.sha256
          ls -lh

      - name: Upload MechOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: MechOS-Arch-Creator-x86_64
          path: |
            out/MechOS-Arch-Creator-x86_64.iso
            out/MechOS-Arch-Creator-x86_64.iso.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
