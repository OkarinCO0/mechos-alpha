name: Publish MechOS v0.3.0 Hotfix 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mechos-hotfix-0.3.0-2-apply.sh'
      - 'scripts/build-hotfix-0.3.0-2.sh'
      - 'scripts/validate-hotfix-0.3.0-2.sh'
      - '.github/workflows/publish-hotfix-0.3.0-2.yml'

permissions:
  contents: write

concurrency:
  group: mechos-hotfix-0.3.0-2-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MechOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bundle tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build Hotfix 2 bundle
        run: |
          set -euo pipefail
          chmod +x scripts/mechos-hotfix-0.3.0-2-apply.sh
          chmod +x scripts/build-hotfix-0.3.0-2.sh
          chmod +x scripts/validate-hotfix-0.3.0-2.sh
          bash scripts/build-hotfix-0.3.0-2.sh
          bash scripts/validate-hotfix-0.3.0-2.sh

      - name: Publish verified bundle and stable manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            updates/bundles/MechOS-0.3.0-hotfix.2-update.tar.zst \
            updates/bundles/MechOS-0.3.0-hotfix.2-update.tar.zst.sha256 \
            updates/stable.json
          if git diff --cached --quiet; then
            echo 'Hotfix 2 is already published.'
            exit 0
          fi
          git commit -m 'Publish MechOS v0.3.0 Hotfix 2'
          git push origin HEAD:main
