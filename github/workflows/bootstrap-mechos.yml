name: Bootstrap MechOS Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap MechOS
        run: |
          chmod +x mechos-bootstrap.sh
          ./mechos-bootstrap.sh

      - name: Commit MechOS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Bootstrap MechOS source"
          git push
